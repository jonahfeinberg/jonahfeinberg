<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="dawn.place" shape-rendering="crispEdges">
  <!--
    dawn.place's mark: a three-by-three board, four units a cell, two-unit
    gutters. Fixed colours rather than the site's theme-aware favicon, because
    the banner and the card set their own paper background in both themes.
  -->
  <g fill="#cfcfcf">
    <rect x="0" y="0" width="4" height="4"/><rect x="6" y="0" width="4" height="4"/>
    <rect x="12" y="0" width="4" height="4"/><rect x="0" y="6" width="4" height="4"/>
  </g>
  <rect x="6" y="6" width="4" height="4" fill="#ffb648"/>
  <rect x="12" y="6" width="4" height="4" fill="#f2645a"/>
  <rect x="0" y="12" width="4" height="4" fill="#2f2b74"/>
  <rect x="6" y="12" width="4" height="4" fill="#7040a8"/>
  <rect x="12" y="12" width="4" height="4" fill="#2f2b74"/>
</svg>
