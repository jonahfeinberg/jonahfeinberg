<style>
circle { fill: #fff; }
.off { opacity: .14; }
.on { opacity: 1; transform-box: fill-box; transform-origin: center; animation: repair .72s cubic-bezier(.3,.7,.3,1) both; }
@keyframes repair {
  0% { opacity: .14; transform: scale(1); }
  30% { opacity: .14; transform: scale(.24); }
  58% { opacity: 1; transform: scale(1.18); }
  80% { opacity: 1; transform: scale(.97); }
  100% { opacity: 1; transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .on { animation: none; opacity: 1; transform: none; } }
</style>
