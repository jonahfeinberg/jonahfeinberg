<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img">
<title>Jonah Feinberg — Lincoln, MA, class of 2028</title>
<!-- CLAUDE -->
<style>
.s{opacity:1;animation:lay 9s ease-out infinite backwards}
@keyframes lay{
0%{opacity:0;transform:translateY(-7px)}
7%{opacity:1;transform:translateY(0)}
86%{opacity:1;transform:translateY(0)}
95%{opacity:0;transform:translateY(-7px)}
100%{opacity:0;transform:translateY(-7px)}
}
@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:1;transform:none}}
.lb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.4px;fill:#5d6259}
.vl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;letter-spacing:.3px;fill:#1e211d}
</style>
